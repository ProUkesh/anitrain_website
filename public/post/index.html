<body id="top" class="font-poppins bg-light-bg text-light-text-primary dark:bg-dark-bg dark:text-dark-text-secondary gradient-bg">

  <footer class="bg-light-bg-secondary dark:bg-dark-bg-secondary pt-14 pb-10">

  <script>
    // ============================
    // CONFIG
    // ============================
    const SITE = "https://anitrain.app";
    const SANITY_PROJECT_ID = "7vt4jf3d";
    const SANITY_DATASET = "production";
    const SANITY_API_VERSION = "2023-03-25";

    const loadingBox = document.getElementById("loadingBox");
    const errorBox = document.getElementById("errorBox");
    const postWrap = document.getElementById("postWrap");

    const heroImg = document.getElementById("heroImg");
    const metaLine = document.getElementById("metaLine");
    const titleEl = document.getElementById("titleEl");
    const descEl = document.getElementById("descEl");
    const bodyEl = document.getElementById("bodyEl");
    const copyBtn = document.getElementById("copyBtn");

    function initTheme() {
      if (localStorage.getItem('theme') === 'dark' ||
          (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      document.getElementById("theme-toggle")?.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
      document.getElementById("currentYear").textContent = new Date().getFullYear();
    }

    function showError(msg) {
      loadingBox.classList.add("hidden");
      errorBox.classList.remove("hidden");
      errorBox.textContent = msg;
    }

    function formatDate(dateStr) {
      if (!dateStr) return "";
      try {
        return new Date(dateStr).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
      } catch { return ""; }
    }

    function safeText(s) {
      return (s || "").toString().replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function getSlugFromPath() {
      // /post/<slug> or /post/<slug>/ (Firebase can sometimes add trailing slash)
      const parts = window.location.pathname.split("/").filter(Boolean); // ["post","slug"]
      if (parts.length >= 2 && parts[0] === "post") return parts[1];
      return null;
    }

    function setCanonical(url) {
      let el = document.querySelector('link[rel="canonical"]');
      if (!el) {
        el = document.createElement("link");
        el.rel = "canonical";
        document.head.appendChild(el);
      }
      el.href = url;
    }

    function setSocialMeta({ title, description, url, image }) {
      document.title = `${title} | AniTrain`;

      const set = (selector, attr, value) => {
        const el = document.querySelector(selector);
        if (el) el.setAttribute(attr, value);
      };

      set('meta[name="description"]', 'content', description);
      set('meta[property="og:title"]', 'content', title);
      set('meta[property="og:description"]', 'content', description);
      set('meta[property="og:url"]', 'content', url);
      set('meta[property="og:image"]', 'content', image);

      set('meta[name="twitter:title"]', 'content', title);
      set('meta[name="twitter:description"]', 'content', description);
      set('meta[name="twitter:image"]', 'content', image);

      setCanonical(url);
    }

    function blocksToHtml(body) {
      // Minimal + safe rendering for Sanity Portable Text blocks
      // Supports: paragraphs + h2
      const blocks = Array.isArray(body) ? body : [];
      const html = blocks.map(b => {
        if (!b || b._type !== "block") return "";
        const style = b.style || "normal";
        const text = (b.children || []).map(c => c.text || "").join("");
        const safe = safeText(text).replace(/\n/g, "<br>");

        if (style === "h2") return `<h2>${safe}</h2>`;
        return `<p>${safe}</p>`;
      }).join("");
      return html || "<p>Content not available.</p>";
    }

    async function fetchPost(slug) {
  const query = `*[_type=="post" && slug.current==$slug][0]{
    title, slug, publishedAt,
    body,
    mainImage{asset->{url}},
    categories[]->{title},
    "updatedAt": coalesce(_updatedAt, publishedAt)
  }`;

  const base =
    `https://${SANITY_PROJECT_ID}.api.sanity.io/v${SANITY_API_VERSION}/data/query/${SANITY_DATASET}`;

  // ✅ IMPORTANT: params must be JSON encoded
  const params = `&$slug=${encodeURIComponent(JSON.stringify(slug))}`;

  const url = `${base}?query=${encodeURIComponent(query)}${params}`;

  const res = await fetch(url);
  if (!res.ok) {
    const txt = await res.text().catch(() => "");
    throw new Error(`Sanity fetch failed: ${res.status} ${txt}`);
  }

  const data = await res.json();
  return data.result;
}


    async function boot() {
      initTheme();

      const slug = getSlugFromPath();
      if (!slug) {
        showError("Post not found. (Missing slug)");
        return;
      }

      try {
        const post = await fetchPost(slug);
        if (!post?.slug?.current) {
          showError("Post not found. (Slug didn't match any post)");
          return;
        }

        const title = post.title || "Untitled";
        const cats = (post.categories || []).map(c => c?.title).filter(Boolean);
        const date = formatDate(post.publishedAt);
        const meta = [cats.slice(0,2).join(" • "), date].filter(Boolean).join(" • ");

        const image = post.mainImage?.asset?.url || `${SITE}/preview.jpg`;
        const url = `${SITE}/post/${encodeURIComponent(post.slug.current)}`;

        // description from first block
        const firstText = (post.body || [])
          .filter(b => b?._type === "block")
          .map(b => (b.children || []).map(c => c.text || "").join(" "))
          .join(" ")
          .replace(/\s+/g, " ")
          .trim();
        const description = firstText ? (firstText.length > 160 ? firstText.slice(0, 157) + "…" : firstText) : "AniTrain News article.";

        setSocialMeta({ title, description, url, image });

        heroImg.src = image;
        heroImg.alt = title;

        metaLine.textContent = meta || "AniTrain";
        titleEl.textContent = title;
        descEl.textContent = description;

        bodyEl.innerHTML = blocksToHtml(post.body);

        copyBtn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(url);
            copyBtn.textContent = "Copied!";
            setTimeout(() => (copyBtn.textContent = "Copy link"), 1200);
          } catch {
            // fallback
            prompt("Copy this link:", url);
          }
        });

        loadingBox.classList.add("hidden");
        postWrap.classList.remove("hidden");
      } catch (e) {
        console.error(e);
        showError("Could not load this post. Please try again.");
      }
    }

    boot();
  </script>
