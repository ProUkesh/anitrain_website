<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AniTrain News & Updates</title>
    
    <meta name="description" content="Stay updated with the latest news, articles, and updates from AniTrain, the ultimate anime fitness app.">
    <meta name="author" content="programmerukesh.com" />
    <link rel="canonical" href="https://anitrain.app/blog.html" />
    <meta name="robots" content="index, follow" />

    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'anitrain-orange': 'hsl(28, 100%, 55%)',
                        'anitrain-orange-dark': 'hsl(28, 100%, 45%)',
                        'dark-bg': 'hsl(240, 10%, 4%)',
                        'dark-bg-secondary': 'hsl(240, 10%, 8%)',
                        'dark-surface': 'hsl(240, 10%, 12%)',
                        'dark-text-primary': 'hsl(0, 0%, 98%)',
                        'dark-text-secondary': 'hsl(240, 5%, 65%)',
                        'dark-border': 'hsl(240, 5%, 20%)',
                        'light-bg': 'hsl(0, 0%, 100%)',
                        'light-bg-secondary': 'hsl(240, 20%, 98%)',
                        'light-surface': 'hsl(0, 0%, 95%)',
                        'light-text-primary': 'hsl(240, 6%, 10%)',
                        'light-text-secondary': 'hsl(240, 4%, 35%)',
                        'light-border': 'hsl(240, 10%, 90%)',
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body, header, section, footer, div, p, h1, h2, h3, a, button, img {
            transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out, border-color 0.3s ease-in-out;
        }
        .modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center; padding: 2rem; z-index: 1000;
        }
        .modal-content {
            background-color: hsl(240, 10%, 12%); color: hsl(0, 0%, 98%);
            padding: 2rem; max-width: 700px; max-height: 90vh; overflow-y: auto;
            border-radius: 10px; position: relative;
        }
        html.light .modal-content {
            background-color: hsl(0, 0%, 95%); color: hsl(240, 6%, 10%);
        }
        .modal-content img { max-width: 100%; border-radius: 8px; margin-bottom: 1rem; }
        .close-btn {
            position: absolute; top: 15px; right: 20px; font-size: 2rem; color: #999;
            cursor: pointer; line-height: 1;
        }
        .close-btn:hover { color: white; }
        html.light .close-btn:hover { color: black; }

        /* Style for active filter button */
        .active-filter {
            background-color: hsl(28, 100%, 55%) !important;
            color: white !important;
        }
    </style>
</head>
<body class="font-poppins bg-light-bg text-light-text-primary dark:bg-dark-bg dark:text-dark-text-primary">

    <header class="sticky top-0 z-50 bg-light-bg/80 dark:bg-dark-bg/80 backdrop-blur-md border-b border-light-border dark:border-dark-border">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
               <a href="./index.html" class="flex-shrink-0">
                  <img src="./anitrain-logo.png" alt="AniTrain logo" class="h-12 sm:h-14 w-12 sm:w-14 object-cover rounded-full shadow-md border border-anitrain-orange">
               </a>
                <nav class="hidden lg:flex lg:items-center lg:space-x-6">
                    <a href="./index.html#features" class="text-sm font-medium text-light-text-secondary dark:text-dark-text-secondary hover:text-anitrain-orange transition-colors">Features</a>
                    <a href="./index.html#characters" class="text-sm font-medium text-light-text-secondary dark:text-dark-text-secondary hover:text-anitrain-orange transition-colors">Characters</a>
                    <a href="./index.html#overview" class="text-sm font-medium text-light-text-secondary dark:text-dark-text-secondary hover:text-anitrain-orange transition-colors">Overview</a>
                    <a href="./blog.html" class="text-sm font-bold text-anitrain-orange transition-colors">News</a>
                </nav>
                <div class="flex items-center space-x-2 sm:space-x-4">
                     <a href="#" class="px-5 py-2.5 bg-anitrain-orange text-white font-medium text-sm leading-tight uppercase rounded-full shadow-lg hover:bg-anitrain-orange-dark hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-anitrain-orange transition-all transform hover:scale-105">
                        Get Started
                    </a>
                    <button id="theme-toggle" type="button" class="p-2 rounded-full text-light-text-secondary dark:text-dark-text-secondary hover:bg-black/5 dark:hover:bg-white/10 focus:outline-none">
                        <ion-icon name="moon-outline" class="text-xl hidden dark:inline"></ion-icon>
                        <ion-icon name="sunny-outline" class="text-xl text-yellow-400 inline dark:hidden"></ion-icon>
                        <span class="sr-only">Toggle theme</span>
                    </button>
                    <div class="lg:hidden">
                        <button id="nav-open-btn" type="button" class="p-2 rounded-md text-light-text-secondary dark:text-dark-text-secondary hover:bg-black/5 dark:hover:bg-white/10" aria-controls="mobile-menu" aria-expanded="false">
                            <span class="sr-only">Open main menu</span>
                            <ion-icon name="menu-outline" class="text-3xl"></ion-icon>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="lg:hidden hidden" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-light-surface dark:bg-dark-surface">
                <a href="./index.html#features" class="block px-3 py-2 rounded-md text-base font-medium">Features</a>
                <a href="./index.html#characters" class="block px-3 py-2 rounded-md text-base font-medium">Characters</a>
                <a href="./index.html#overview" class="block px-3 py-2 rounded-md text-base font-medium">Overview</a>
                <a href="./blog.html" class="block px-3 py-2 rounded-md text-base font-medium text-anitrain-orange">News</a>
            </div>
        </div>
    </header>

    <main class="bg-light-bg-secondary dark:bg-dark-bg-secondary">
        <section class="py-16 lg:py-24">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div class="text-center mb-8 lg:mb-12">
                    <h1 class="text-4xl lg:text-5xl font-extrabold" data-aos="fade-up">News & Updates</h1>
                    <p class="mt-4 max-w-2xl mx-auto text-light-text-secondary dark:text-dark-text-secondary" data-aos="fade-up" data-aos-delay="100">
                        The latest articles, announcements, and stories from the AniTrain world.
                    </p>
                </div>
                
                <div id="category-filters" class="flex flex-wrap justify-center gap-2 mb-10 lg:mb-14" data-aos="fade-up" data-aos-delay="200">
                    </div>

                <div id="posts" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" data-aos="fade-up" data-aos-delay="300">
                    </div>
            </div>
        </section>
    </main>

    <div class="modal" id="postModal">
      <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <img id="modalImage" src="" alt="Post Image">
        <h2 id="modalTitle" class="text-3xl font-bold mb-4"></h2>
        <div id="modalBody" class="prose dark:prose-invert max-w-none text-light-text-secondary dark:text-dark-text-secondary"></div>
      </div>
    </div>

    <footer class="bg-light-bg dark:bg-dark-bg pt-16 pb-8">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="border-t border-light-border dark:border-dark-border pt-8 text-center space-y-2">
          <p class="text-light-text-secondary dark:text-dark-text-secondary text-sm">
            &copy; <span id="currentYear"></span> AniTrain. All rights reserved. Unleash Your Inner Hero.
          </p>
          <p class="text-light-text-secondary dark:text-dark-text-secondary text-sm">
            Built with ❤️ by <a href="https://programmerukesh.com" target="_blank" rel="noopener noreferrer" class="text-anitrain-orange hover:underline">programmerukesh.com</a>
          </p>
        </div>
      </div>
    </footer>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
      AOS.init({
          once: true,
          mirror: false,
          duration: 700,
          easing: 'ease-out-cubic',
      });
      
      let allPosts = []; // Store all fetched posts here

      async function fetchPosts() {
        try {
          const query = encodeURIComponent(`*[_type == "post"] | order(publishedAt desc){
            _id, title, slug, body, mainImage{asset->{url}}, publishedAt, categories[]->{title}
          }`);
          const url = `https://7vt4jf3d.api.sanity.io/v2023-03-25/data/query/production?query=${query}`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.result) {
            allPosts = data.result;
            setupCategoryFilters();
            filterPosts('All'); // Display all posts by default
          }
        } catch (err) {
          console.error("Sanity fetch error:", err);
          document.getElementById("posts").innerHTML = `<p class="text-center col-span-full">Failed to load posts. Please try again later.</p>`;
        }
      }

      function setupCategoryFilters() {
        const categories = ["All", "Anime News", "Anime Reviews", "Upcoming Anime", "Anime Movies", "Training Tips", "Community Spotlight"];
        const container = document.getElementById("category-filters");
        container.innerHTML = ""; // Clear any existing buttons
        categories.forEach(category => {
          const button = document.createElement("button");
          button.textContent = category;
          button.className = "filter-btn px-4 py-2 text-sm font-semibold rounded-full transition-colors duration-300 bg-light-surface dark:bg-dark-surface text-light-text-secondary dark:text-dark-text-secondary hover:bg-anitrain-orange/80 hover:text-white";
          button.onclick = () => filterPosts(category);
          container.appendChild(button);
        });
      }

      function filterPosts(category) {
        // Update active button style
        document.querySelectorAll('#category-filters .filter-btn').forEach(btn => {
          btn.classList.remove('active-filter');
          if (btn.textContent === category) {
            btn.classList.add('active-filter');
          }
        });

        const filteredPosts = category === 'All'
          ? allPosts
          : allPosts.filter(post => post.categories && post.categories.some(c => c.title === category));
        
        renderPosts(filteredPosts);
      }

      function renderPosts(posts) {
        const container = document.getElementById("posts");
        container.innerHTML = "";
        if (posts.length === 0) {
            container.innerHTML = `<p class="text-center col-span-full text-light-text-secondary dark:text-dark-text-secondary">No posts found in this category.</p>`;
            return;
        }
        posts.forEach(post => {
          const card = document.createElement("div");
          card.className = "post-card bg-light-surface dark:bg-dark-surface rounded-lg shadow-lg overflow-hidden transform hover:-translate-y-2 transition-transform duration-300 cursor-pointer";
          card.innerHTML = `
            <img src="${post.mainImage?.asset?.url || 'https://placehold.co/600x400/171717/FFF?text=AniTrain'}" alt="${post.title}" class="w-full h-48 object-cover">
            <div class="p-6">
              <p class="text-sm text-light-text-secondary dark:text-dark-text-secondary mb-2">${new Date(post.publishedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
              <h3 class="text-xl font-bold mb-4">${post.title}</h3>
              <div class="flex flex-wrap gap-2">
                ${(post.categories || []).map(cat => `<span class="text-xs font-semibold bg-anitrain-orange/20 text-anitrain-orange rounded-full px-2 py-1">${cat.title}</span>`).join('')}
              </div>
            </div>
          `;
          card.onclick = () => openModal(post);
          container.appendChild(card);
        });
      }

      function openModal(post) {
        document.getElementById("modalTitle").innerText = post.title;
        document.getElementById("modalImage").src = post.mainImage?.asset?.url || '';
        document.getElementById("modalBody").innerHTML = (post.body || []).map(block => {
            if (block._type === 'block' && block.children) {
                return `<p class="mb-4">${block.children.map(child => child.text).join('')}</p>`;
            }
            return '';
        }).join('');
        document.getElementById("postModal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("postModal").style.display = "none";
      }

      const themeToggleBtn = document.getElementById('theme-toggle');
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
      } else {
          document.documentElement.classList.remove('dark');
      }
      themeToggleBtn.addEventListener('click', () => {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });

      const navOpenBtn = document.getElementById('nav-open-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      if (navOpenBtn && mobileMenu) {
          navOpenBtn.addEventListener('click', () => {
              const isExpanded = mobileMenu.classList.toggle('hidden');
              navOpenBtn.setAttribute('aria-expanded', String(!isExpanded));
              navOpenBtn.querySelector('ion-icon').name = isExpanded ? 'menu-outline' : 'close-outline';
          });
      }

      document.getElementById("currentYear").textContent = new Date().getFullYear();

      fetchPosts();
    </script>
</body>
</html>
