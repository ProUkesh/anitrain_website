  <main class="py-12 lg:py-14">

      <!-- Search + Sort -->
      <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-3 mb-8">

            <ion-icon name="search-outline" class="absolute left-4 top-1/2 -translate-y-1/2 text-xl text-light-text-secondary dark:text-dark-text-secondary"></ion-icon>
            <input id="searchInput" type="text" placeholder="Search posts (title, category, author)..."
              class="w-full pl-12 pr-4 py-3 rounded-2xl border border-light-border dark:border-dark-border bg-light-surface dark:bg-dark-surface focus:outline-none focus:ring-4 focus:ring-anitrain-orange/20">

      <!-- Categories -->

  <footer class="bg-light-bg dark:bg-dark-bg pt-12 pb-8">

        <p class="text-light-text-secondary dark:text-dark-text-secondary text-sm">
          Built with ❤️ by <a href="https://programmerukesh.com" target="_blank" class="text-anitrain-orange hover:underline">programmerukesh.com</a>

  <a href="#top" id="go-top"
     class="fixed bottom-6 right-6 z-50 p-4 bg-anitrain-orange text-white rounded-full shadow-lg hover:bg-anitrain-orange-dark transition-all opacity-0 pointer-events-none duration-300">
    <ion-icon name="chevron-up-outline" class="text-2xl"></ion-icon>
  </a>

  <script>
    // ============================
    // ✅ CONFIG (Sanity)
    // ============================
    const SANITY_PROJECT_ID = "7vt4jf3d";
    const SANITY_DATASET = "production";
    const SANITY_API_VERSION = "2023-03-25";

    // State
    let allPosts = [];
    let allCategories = [];
    let activeCategory = "All";
    let searchTerm = "";
    let sortMode = "newest";
    const PAGE_SIZE = 9;
    let visibleCount = PAGE_SIZE;

    const $ = (id) => document.getElementById(id);

    function safeText(text) {
      return (text || "").toString().replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatDate(dateStr) {
      if (!dateStr) return "";
      try { return new Date(dateStr).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }); }
      catch { return ""; }
    }

    function getExcerptFromBody(body, maxChars = 150) {
      if (!Array.isArray(body)) return "";
      const texts = [];
      for (const block of body) {
        if (block?._type === "block" && Array.isArray(block.children)) {
          const t = block.children.map(c => c.text || "").join("");
          if (t) texts.push(t);
        }
        if (texts.join(" ").length > maxChars) break;
      }
      const joined = texts.join(" ").trim().replace(/\s+/g, " ");
      return joined.length > maxChars ? joined.slice(0, maxChars).trim() + "…" : joined;
    }

    function estimateReadTime(body) {
      const text = getExcerptFromBody(body, 5000);
      const words = text.split(/\s+/).filter(Boolean).length;
      const minutes = Math.max(1, Math.round(words / 200));
      return `${minutes} min read`;
    }

    function getLocalViews(slug) {
      try {
        const raw = localStorage.getItem("anitrain_post_views") || "{}";
        const obj = JSON.parse(raw);
        return Number(obj[slug] || 0);
      } catch { return 0; }
    }

    async function shareLink(title, url) {
      try {
        if (navigator.share) await navigator.share({ title, url });
        else { await navigator.clipboard.writeText(url); alert("Link copied!"); }
      } catch {}
    }

    // Fast: fetch posts + categories in parallel
    async function fetchPosts() {
      const query = encodeURIComponent(`*[_type == "post"] | order(publishedAt desc){
        title, slug, body, mainImage{asset->{url}}, publishedAt,
        categories[]->{title},
        author->{name, image{asset->{url}}}
      }`);
      const url = `https://${SANITY_PROJECT_ID}.api.sanity.io/v${SANITY_API_VERSION}/data/query/${SANITY_DATASET}?query=${query}`;
      const res = await fetch(url);
      const data = await res.json();
      allPosts = Array.isArray(data.result) ? data.result : [];
    }

    async function fetchCategories() {
      const query = encodeURIComponent(`*[_type == "category"] | order(title asc){ title }`);
      const url = `https://${SANITY_PROJECT_ID}.api.sanity.io/v${SANITY_API_VERSION}/data/query/${SANITY_DATASET}?query=${query}`;
      const res = await fetch(url);
      const data = await res.json();
      allCategories = Array.isArray(data.result) ? data.result.map(x => x.title).filter(Boolean) : [];
    }

    function setupCategoryFilters() {
      const container = $("category-filters");
      container.innerHTML = "";

      const categories = ["All", ...allCategories];
      const frag = document.createDocumentFragment();

      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = cat;
        btn.className = "filter-btn px-4 py-2 font-semibold border rounded-full transition-all bg-light-surface dark:bg-dark-surface border-light-border dark:border-dark-border text-light-text-secondary dark:text-dark-text-secondary";
        btn.addEventListener("click", () => {
          activeCategory = cat;
          visibleCount = PAGE_SIZE;
          applyFiltersAndRender();
        });
        frag.appendChild(btn);
      });

      container.appendChild(frag);
      setActiveFilterButton();
    }

    function setActiveFilterButton() {
      document.querySelectorAll('#category-filters button').forEach(btn => {
        btn.classList.toggle("active-filter", btn.textContent === activeCategory);
      });
    }

    function applyFilters(posts) {
      let filtered = [...posts];

      if (activeCategory !== "All") {
        filtered = filtered.filter(p => (p.categories || []).some(c => c?.title === activeCategory));
      }

      if (searchTerm.trim()) {
        const s = searchTerm.trim().toLowerCase();
        filtered = filtered.filter(p => {
          const title = (p.title || "").toLowerCase();
          const author = (p.author?.name || "").toLowerCase();
          const cats = (p.categories || []).map(c => (c?.title || "").toLowerCase()).join(" ");
          return title.includes(s) || author.includes(s) || cats.includes(s);
        });
      }

      if (sortMode === "oldest") {
        filtered.sort((a,b) => new Date(a.publishedAt) - new Date(b.publishedAt));
      } else if (sortMode === "popular") {
        filtered.sort((a,b) => getLocalViews(b.slug?.current || "") - getLocalViews(a.slug?.current || ""));
      } else {
        filtered.sort((a,b) => new Date(b.publishedAt) - new Date(a.publishedAt));
      }

      return filtered;
    }

    function renderPosts(posts) {
      const container = $("posts");
      const noResults = $("noResults");
      const loadMoreBtn = $("loadMoreBtn");

      container.innerHTML = "";

      if (!posts.length) {
        noResults.classList.remove("hidden");
        loadMoreBtn.classList.add("hidden");
        return;
      }
      noResults.classList.add("hidden");

      const visible = posts.slice(0, visibleCount);
      const frag = document.createDocumentFragment();

      visible.forEach(post => {
        const slug = post.slug?.current || "";
        const date = formatDate(post.publishedAt);
        const authorName = post.author?.name || "AniTrain";
        const authorAvatar = post.author?.image?.asset?.url || "https://placehold.co/80x80/101010/FF951A?text=AU";
        const imageUrl = post.mainImage?.asset?.url || "https://placehold.co/600x400/171717/FFF?text=AniTrain";
        const excerpt = getExcerptFromBody(post.body);
        const readTime = estimateReadTime(post.body);
        const views = getLocalViews(slug);

        const card = document.createElement("div");
        card.className = "post-card bg-white dark:bg-dark-surface rounded-2xl shadow-lg overflow-hidden border border-light-border dark:border-dark-border";

        card.innerHTML = `
          <a href="./post.html?slug=${encodeURIComponent(slug)}" class="block">
            <div class="overflow-hidden">
              <img src="${imageUrl}" alt="${safeText(post.title)}" class="w-full h-48 object-cover" loading="lazy"
                   onerror="this.onerror=null;this.src='https://placehold.co/600x400/171717/FFF?text=AniTrain';">
            </div>

            <div class="p-6">
              <p class="text-sm text-light-text-secondary dark:text-dark-text-secondary mb-2">${date || ""}</p>

              <h3 class="text-xl font-bold mb-2 text-light-text-primary dark:text-dark-text-primary clamp-2">
                ${safeText(post.title)}
              </h3>

              <div class="flex items-center gap-2 mb-3">
                <img src="${authorAvatar}" alt="${safeText(authorName)}"
                     class="w-7 h-7 rounded-full object-cover border border-light-border dark:border-dark-border"
                     loading="lazy"
                     onerror="this.onerror=null;this.src='https://placehold.co/80x80/101010/FF951A?text=AU';">
                <p class="text-sm text-light-text-secondary dark:text-dark-text-secondary">
                  by <span class="font-semibold text-light-text-primary dark:text-dark-text-primary">${safeText(authorName)}</span>
                  <span class="mx-2">•</span> ${readTime}
                  <span class="mx-2">•</span> ${views} views
                </p>
              </div>

              <p class="text-sm text-light-text-secondary dark:text-dark-text-secondary mb-4 clamp-3">
                ${safeText(excerpt)}
              </p>

              <div class="flex flex-wrap gap-2 mb-4">
                ${(post.categories || []).map(cat =>
                  `<span class="text-xs font-semibold px-2 py-1 bg-anitrain-orange/10 text-anitrain-orange rounded-full">${safeText(cat.title)}</span>`
                ).join('')}
              </div>

              <div class="flex items-center justify-between gap-2">
                <span class="inline-flex items-center gap-2 text-sm font-semibold text-anitrain-orange">
                  Read →
                </span>

                <button class="share-btn text-sm px-3 py-1.5 rounded-full border border-light-border dark:border-dark-border hover:bg-anitrain-orange/10"
                        data-title="${safeText(post.title)}"
                        data-url="https://anitrain.app/post.html?slug=${encodeURIComponent(slug)}"
                        type="button">
                  Share
                </button>
              </div>
            </div>
          </a>
        `;

        frag.appendChild(card);
      });

      container.appendChild(frag);

      if (posts.length > visibleCount) loadMoreBtn.classList.remove("hidden");
      else loadMoreBtn.classList.add("hidden");

      document.querySelectorAll(".share-btn").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const title = btn.getAttribute("data-title") || "AniTrain";
          const url = btn.getAttribute("data-url") || location.href;
          await shareLink(title, url);
        });
      });
    }

    function applyFiltersAndRender() {
      setActiveFilterButton();
      const filtered = applyFilters(allPosts);
      renderPosts(filtered);
    }

    // Header UI
    function initHeaderUi() {
      // Theme
      const themeToggle = $("theme-toggle");
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      themeToggle?.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });

      // Mobile menu
      const navOpenBtn = $("nav-open-btn");
      const mobileMenu = $("mobile-menu");
      navOpenBtn?.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
        const icon = navOpenBtn.querySelector("ion-icon");
        if (icon) icon.name = mobileMenu.classList.contains("hidden") ? "menu-outline" : "close-outline";
      });

      // Go top
      const goTop = $("go-top");
      window.addEventListener('scroll', () => {
        const show = window.scrollY >= 400;
        goTop.classList.toggle('opacity-0', !show);
        goTop.classList.toggle('pointer-events-none', !show);
      });

      $("currentYear").textContent = new Date().getFullYear();
    }

    // Search + Sort + Load more
    $("searchInput").addEventListener("input", (e) => {
      searchTerm = e.target.value || "";
      visibleCount = PAGE_SIZE;
      applyFiltersAndRender();
    });

    $("sortSelect").addEventListener("change", (e) => {
      sortMode = e.target.value || "newest";
      visibleCount = PAGE_SIZE;
      applyFiltersAndRender();
    });

    $("loadMoreBtn").addEventListener("click", () => {
      visibleCount += PAGE_SIZE;
      applyFiltersAndRender();
    });

    // Init
    (async function init() {
      initHeaderUi();
      await Promise.all([fetchCategories(), fetchPosts()]);
      setupCategoryFilters();
      applyFiltersAndRender();
    })();
  </script>
</body>
