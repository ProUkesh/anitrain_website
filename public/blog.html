<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AniTrain News & Updates</title>
  <meta name="description" content="Stay updated with the latest news, articles, and updates from AniTrain, the ultimate anime fitness app.">
  <meta name="author" content="programmerukesh.com" />
  <link rel="canonical" href="https://anitrain.app/blog.html" />
  <meta name="robots" content="index, follow" />
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />

  <!-- Scripts & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'anitrain-orange': 'hsl(28, 100%, 55%)',
            'anitrain-orange-dark': 'hsl(28, 100%, 45%)',
            'dark-bg': 'hsl(240, 10%, 4%)',
            'dark-bg-secondary': 'hsl(240, 10%, 8%)',
            'dark-surface': 'hsl(240, 10%, 12%)',
            'dark-text-primary': 'hsl(0, 0%, 98%)',
            'dark-text-secondary': 'hsl(240, 5%, 65%)',
            'dark-border': 'hsl(240, 5%, 20%)',
            'light-bg': 'hsl(0, 0%, 100%)',
            'light-bg-secondary': 'hsl(240, 20%, 98%)',
            'light-surface': 'hsl(0, 0%, 95%)',
            'light-text-primary': 'hsl(240, 6%, 10%)',
            'light-text-secondary': 'hsl(240, 4%, 35%)',
            'light-border': 'hsl(240, 10%, 90%)',
          },
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
          },
          animation: {
            'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' }
            },
            glow: {
              'from': { textShadow: '0 0 10px rgba(255,149,26,0.7), 0 0 20px rgba(255,149,26,0.5)' },
              'to': { textShadow: '0 0 25px rgba(255,149,26,0.9), 0 0 45px rgba(255,149,26,0.7)' }
            }
          }
        }
      }
    };
  </script>

  <!-- Custom Styles -->
  <style>
    body, header, section, footer, div, p, h1, h2, h3, a, button, img {
      transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out, border-color 0.3s ease-in-out;
    }
    /* Anime Scroll Line */
    .scroll-line {
      position: relative;
      height: 100%;
    }
    .scroll-line::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      background: linear-gradient(to bottom, transparent, #FF951A, transparent);
      transform: translateX(-50%);
    }
    .scroll-orb {
      position: absolute;
      width: 16px;
      height: 16px;
      background: #FF951A;
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 15px rgba(255, 149, 26, 0.6);
      animation: float 4s infinite alternate;
    }
    .scroll-orb:nth-child(1) { top: 20%; animation-delay: 0s; }
    .scroll-orb:nth-child(2) { top: 45%; animation-delay: 1s; }
    .scroll-orb:nth-child(3) { top: 70%; animation-delay: 2s; }

    /* Modal */
    .modal {
      display: none; /* Initially hidden */
    }
    .modal.show {
      display: flex; /* Shown with JS */
    }
    
    /* Filter Buttons */
    .filter-btn:hover {
      background-color: #FF951A;
      color: white;
      transform: translateY(-2px);
    }
    .active-filter {
      background-color: #FF951A !important;
      color: white !important;
      box-shadow: 0 5px 15px rgba(255, 149, 26, 0.3);
    }

    /* Post Card */
    .post-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      border-color: #FF951A;
    }
    .post-card img {
      transition: transform 0.4s ease;
    }
    .post-card:hover img {
      transform: scale(1.05);
    }
    /* Saiyan Mode Toggle */
    #theme-toggle.saiyan {
      animation: glow 1.5s infinite alternate;
    }
  </style>
</head>
<body class="font-poppins bg-light-bg-secondary text-light-text-primary dark:bg-dark-bg-secondary dark:text-dark-text-primary">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-light-bg/80 dark:bg-dark-bg/80 backdrop-blur-md border-b border-light-border dark:border-dark-border">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="./index.html" class="flex-shrink-0">
          <img src="./anitrain-logo.png" alt="AniTrain logo" class="h-12 sm:h-14 w-12 sm:w-14 object-cover rounded-full shadow-md border-2 border-anitrain-orange" onerror="this.onerror=null;this.src='https://placehold.co/56x56/101010/FF951A?text=AT';">
        </a>
        <nav class="hidden lg:flex lg:items-center lg:space-x-8">
          <a href="./index.html#features" class="text-sm font-medium text-light-text-secondary dark:text-dark-text-secondary hover:text-anitrain-orange transition-colors">Features</a>
          <a href="./index.html#characters" class="text-sm font-medium text-light-text-secondary dark:text-dark-text-secondary hover:text-anitrain-orange transition-colors">Characters</a>
          <a href="./index.html#reviews" class="text-sm font-medium text-light-text-secondary dark:text-dark-text-secondary hover:text-anitrain-orange transition-colors">Testimonials</a>
          <a href="./blog.html" class="text-sm font-bold text-anitrain-orange transition-colors">News</a>
        </nav>
        <div class="flex items-center space-x-3 sm:space-x-4">
          <button id="support-btn" class="px-6 py-3 bg-gradient-to-r from-anitrain-orange to-anitrain-orange-dark text-white font-semibold text-sm rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all focus:outline-none focus:ring-4 focus:ring-anitrain-orange/50">
            💖 Support Us
          </button>
          <button id="theme-toggle" type="button" class="p-2.5 rounded-full bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 focus:outline-none transition-colors">
            <ion-icon name="sunny-outline" class="text-xl inline dark:hidden text-yellow-400"></ion-icon>
            <ion-icon name="moon-outline" class="text-xl hidden dark:inline text-white"></ion-icon>
          </button>
          <div class="lg:hidden">
            <button id="nav-open-btn" type="button" class="p-2.5 rounded-lg bg-black/5 dark:bg-white/10 text-light-text-secondary dark:text-dark-text-secondary hover:bg-black/10 dark:hover:bg-white/20">
              <ion-icon name="menu-outline" class="text-2xl"></ion-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="lg:hidden hidden bg-light-surface dark:bg-dark-surface border-t border-light-border dark:border-dark-border" id="mobile-menu">
      <div class="px-4 pt-3 pb-4 space-y-3">
        <a href="./index.html#features" class="block px-4 py-2 rounded-lg text-base font-medium text-light-text-secondary dark:text-dark-text-secondary hover:bg-anitrain-orange/20 hover:text-anitrain-orange transition-all">Features</a>
        <a href="./index.html#characters" class="block px-4 py-2 rounded-lg text-base font-medium text-light-text-secondary dark:text-dark-text-secondary hover:bg-anitrain-orange/20 hover:text-anitrain-orange transition-all">Characters</a>
        <a href="./index.html#reviews" class="block px-4 py-2 rounded-lg text-base font-medium text-light-text-secondary dark:text-dark-text-secondary hover:bg-anitrain-orange/20 hover:text-anitrain-orange transition-all">Testimonials</a>
        <a href="./blog.html" class="block px-4 py-2 rounded-lg text-base font-medium text-anitrain-orange bg-anitrain-orange/10">News</a>
      </div>
    </div>
  </header>

  <main class="py-16 lg:py-24">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="text-center mb-8 lg:mb-12">
        <h1 class="text-4xl lg:text-5xl font-extrabold mb-4 text-light-text-primary dark:text-dark-text-primary animate-glow">
          <span class="text-anitrain-orange">Dojo</span> News
        </h1>
        <p class="mt-4 max-w-2xl mx-auto text-light-text-secondary dark:text-dark-text-secondary" data-aos="fade-up">
          The latest articles, announcements, and stories from the AniTrain world.
        </p>
      </div>

      <!-- Category Filters -->
      <div id="category-filters" class="flex flex-wrap justify-center gap-3 mb-10 lg:mb-14" data-aos="fade-up">
        <!-- Dynamically populated -->
      </div>

      <!-- Posts Grid -->
      <div class="scroll-line relative">
        <div id="posts" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 relative z-10" data-aos="fade-up">
          <!-- Dynamically populated -->
        </div>
        <!-- Anime Orbs -->
        <div class="scroll-orb"></div>
        <div class="scroll-orb"></div>
        <div class="scroll-orb"></div>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div id="postModal" class="modal fixed top-0 left-0 right-0 bottom-0 bg-black/80 backdrop-blur-sm z-[1000] justify-center items-center p-4">
    <div class="modal-content bg-light-surface dark:bg-dark-surface text-light-text-primary dark:text-dark-text-primary p-6 md:p-8 max-w-3xl w-full max-h-[90vh] overflow-y-auto rounded-2xl relative shadow-2xl border border-light-border dark:border-dark-border">
      <button class="close-btn absolute top-4 right-4 text-light-text-secondary dark:text-dark-text-secondary hover:text-anitrain-orange dark:hover:text-anitrain-orange text-4xl leading-none">&times;</button>
      <img id="modalImage" src="" alt="Post Image" class="w-full h-auto max-h-80 object-cover rounded-lg mb-6">
      <h2 id="modalTitle" class="text-3xl font-bold mb-4"></h2>
      <div id="modalBody" class="prose dark:prose-invert max-w-none text-light-text-secondary dark:text-dark-text-secondary"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-light-bg dark:bg-dark-bg pt-16 pb-8">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="border-t border-light-border dark:border-dark-border pt-8 text-center space-y-2">
        <p class="text-light-text-secondary dark:text-dark-text-secondary text-sm">
          &copy; <span id="currentYear"></span> AniTrain. All rights reserved. Unleash Your Inner Hero.
        </p>
        <p class="text-light-text-secondary dark:text-dark-text-secondary text-sm">
          Built with ❤️ by <a href="https://programmerukesh.com" target="_blank" class="text-anitrain-orange hover:underline">programmerukesh.com</a>
        </p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({
      once: true,
      mirror: false,
      duration: 700,
      easing: 'ease-out-cubic',
    });

    let allPosts = [];

    // Fetch posts from Sanity
    async function fetchPosts() {
      try {
        const query = encodeURIComponent(`*[_type == "post"] | order(publishedAt desc){
          _id, title, slug, body, mainImage{asset->{url}}, publishedAt, categories[]->{title}
        }`);
        const url = `https://7vt4jf3d.api.sanity.io/v2023-03-25/data/query/production?query=${query}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.result) {
          allPosts = data.result;
          setupCategoryFilters();
          filterPosts('All');
        }
      } catch (err) {
        console.error("Sanity fetch error:", err);
        document.getElementById("posts").innerHTML = `<p class="text-center col-span-full text-light-text-secondary dark:text-dark-text-secondary">Failed to load posts. Please try again later.</p>`;
      }
    }

    // Setup category filters
    function setupCategoryFilters() {
      const categories = ["All", "Anime News", "Anime Reviews", "Upcoming Anime", "Training Tips", "Community Spotlight"];
      const container = document.getElementById("category-filters");
      if (!container) return;
      container.innerHTML = "";
      categories.forEach(category => {
        const button = document.createElement("button");
        button.textContent = category;
        button.className = "filter-btn px-4 py-2 font-semibold border rounded-full transition-all duration-300 bg-light-surface dark:bg-dark-surface border-light-border dark:border-dark-border text-light-text-secondary dark:text-dark-text-secondary";
        button.onclick = () => filterPosts(category);
        container.appendChild(button);
      });
    }

    // Filter posts
    function filterPosts(category) {
      document.querySelectorAll('#category-filters .filter-btn').forEach(btn => {
        btn.classList.remove('active-filter');
        if (btn.textContent === category) {
          btn.classList.add('active-filter');
        }
      });

      const filteredPosts = category === 'All'
        ? allPosts
        : allPosts.filter(post => post.categories && post.categories.some(c => c.title === category));

      renderPosts(filteredPosts);
    }

    // Render posts
    function renderPosts(posts) {
      const container = document.getElementById("posts");
      if (!container) return;
      container.innerHTML = "";
      if (posts.length === 0) {
        container.innerHTML = `<p class="text-center col-span-full text-light-text-secondary dark:text-dark-text-secondary">No posts found in this category.</p>`;
        return;
      }
      posts.forEach(post => {
        const card = document.createElement("div");
        card.className = "post-card bg-white dark:bg-dark-surface rounded-xl shadow-lg overflow-hidden transform transition-all duration-300 cursor-pointer border border-light-border dark:border-dark-border";
        card.innerHTML = `
          <div class="overflow-hidden"><img src="${post.mainImage?.asset?.url || 'https://placehold.co/600x400/171717/FFF?text=AniTrain'}" alt="${post.title}" class="w-full h-48 object-cover"></div>
          <div class="p-6">
            <p class="text-sm text-light-text-secondary dark:text-dark-text-secondary mb-2">${new Date(post.publishedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
            <h3 class="text-xl font-bold mb-4 text-light-text-primary dark:text-dark-text-primary">${post.title}</h3>
            <div class="flex flex-wrap gap-2">
              ${(post.categories || []).map(cat => `<span class="text-xs font-semibold px-2 py-1 bg-anitrain-orange/10 text-anitrain-orange rounded-full">${cat.title}</span>`).join('')}
            </div>
          </div>
        `;
        card.onclick = () => openModal(post);
        container.appendChild(card);
      });
    }

    // Modal
    const modal = document.getElementById("postModal");
    const modalCloseBtn = document.querySelector("#postModal .close-btn");

    function openModal(post) {
      if (!modal) return;
      document.getElementById("modalTitle").innerText = post.title;
      document.getElementById("modalImage").src = post.mainImage?.asset?.url || '';
      document.getElementById("modalBody").innerHTML = (post.body || []).map(block => {
        if (block._type === 'block' && block.children) {
          return `<p class="mb-4">${block.children.map(child => child.text).join('')}</p>`;
        }
        return '';
      }).join('');
      modal.classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      if (!modal) return;
      modal.classList.remove('show');
      document.body.style.overflow = '';
    }
    modalCloseBtn?.addEventListener('click', closeModal);
    modal?.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });

    // Theme Toggle
    const themeToggle = document.getElementById('theme-toggle');
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      themeToggle?.classList.add('saiyan');
    } else {
      document.documentElement.classList.remove('dark');
    }
    themeToggle?.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      isDark ? themeToggle.classList.add('saiyan') : themeToggle.classList.remove('saiyan');
    });

    // Mobile Menu
    const navOpenBtn = document.getElementById('nav-open-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    if (navOpenBtn && mobileMenu) {
      navOpenBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        const icon = navOpenBtn.querySelector('ion-icon');
        icon.name = mobileMenu.classList.contains('hidden') ? 'menu-outline' : 'close-outline';
      });
    }

    // Year
    const currentYearEl = document.getElementById('currentYear');
    if(currentYearEl) currentYearEl.textContent = new Date().getFullYear();

    // Initial Fetch
    fetchPosts();
  </script>
</body>
</html>
