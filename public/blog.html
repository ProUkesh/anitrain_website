<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniTrain News & Blog</title>
  <meta name="description" content="Latest anime news, reviews, and highlights from AniTrain News." />
  <link rel="shortcut icon" href="https://anitrain.app/favicon.ico" type="image/x-icon" />
  
  <script src="https://cdn.jsdelivr.net/npm/@portabletext/to-html@3.0.1/dist/index.umd.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'anitrain-orange': 'hsl(28, 100%, 55%)',
            'anitrain-orange-dark': 'hsl(28, 100%, 45%)',
            'dark-bg': 'hsl(240, 10%, 4%)',
            'dark-surface': 'hsl(240, 10%, 12%)',
            'dark-border': 'hsl(240, 5%, 20%)',
            'dark-text-primary': 'hsl(0, 0%, 98%)',
            'dark-text-secondary': 'hsl(240, 5%, 65%)',
            'light-bg': 'hsl(0, 0%, 100%)',
            'light-surface': 'hsl(0, 0%, 95%)',
            'light-border': 'hsl(240, 10%, 90%)',
            'light-text-primary': 'hsl(240, 6%, 10%)',
            'light-text-secondary': 'hsl(240, 4%, 35%)',
          },
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* ============================================
    MODAL POPUP STYLES
    ============================================ */
    .modal-backdrop {
      position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; padding: 1rem; opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease-in-out;
    }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background-color: hsl(0, 0%, 100%); color: hsl(240, 6%, 10%);
      border-radius: 1rem; max-width: 42rem; width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      transform: scale(0.95); transition: transform 0.3s ease-in-out;
      position: relative; max-height: calc(100vh - 4rem);
      display: flex; flex-direction: column;
    }
    .dark .modal-content { background-color: hsl(240, 10%, 4%); color: hsl(0, 0%, 98%); }
    .modal-backdrop.active .modal-content { transform: scale(1); }
    .modal-header { padding: 1.5rem; border-bottom: 1px solid hsl(240, 10%, 90%); flex-shrink: 0; }
    .dark .modal-header { border-color: hsl(240, 5%, 20%); }
    .modal-body-container { padding: 1.5rem; flex-grow: 1; overflow-y: auto; }
    .modal-close-btn {
      position: absolute; top: -0.75rem; right: -0.75rem;
      background-color: hsl(28, 100%, 55%); color: white;
      border-radius: 9999px; width: 2.25rem; height: 2.25rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; line-height: 1;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
      transition: all 0.2s ease; z-index: 10; border: none; cursor: pointer;
    }
    .modal-close-btn:hover { background-color: hsl(28, 100%, 45%); transform: scale(1.1); }
    .modal-body-container::-webkit-scrollbar { width: 8px; }
    .modal-body-container::-webkit-scrollbar-track { background: transparent; }
    .modal-body-container::-webkit-scrollbar-thumb {
      background-color: hsl(240, 5%, 40%); border-radius: 20px; border: 3px solid transparent;
    }

    /* ============================================
    CATEGORY FILTER BUTTON STYLES
    ============================================ */
    .category-btn {
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-weight: 500;
      font-size: 0.875rem;
      transition: all 0.3s ease;
      background-color: transparent;
      cursor: pointer;
    }
    html:not(.dark) .category-btn {
      border: 1px solid hsl(240, 10%, 90%);
      color: hsl(240, 4%, 35%);
    }
    .dark .category-btn {
      border: 1px solid hsl(240, 5%, 20%);
      color: hsl(240, 5%, 65%);
    }
    .category-btn.active, .category-btn:hover {
      background-color: hsl(28, 100%, 55%); /* anitrain-orange */
      color: white !important;
      border-color: hsl(28, 100%, 55%) !important;
    }
  </style>
</head>

<body class="font-poppins bg-light-bg text-light-text-primary dark:bg-dark-bg dark:text-dark-text-primary">

  <header class="sticky top-0 z-40 bg-light-bg/80 dark:bg-dark-bg/80 backdrop-blur-md border-b border-light-border dark:border-dark-border">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
            <a href="index.html" class="flex-shrink-0 flex items-center gap-3">
                <img src="https://anitrain.app/anitrain-logo.png" alt="AniTrain logo" class="h-12 w-12 object-cover rounded-full shadow-md border border-anitrain-orange">
                <span class="text-xl font-bold text-light-text-primary dark:text-dark-text-primary">AniTrain</span>
            </a>
            <nav class="hidden lg:flex lg:items-center lg:space-x-6">
                <a href="index.html#features" class="text-sm font-medium text-light-text-secondary dark:text-dark-text-secondary hover:text-anitrain-orange transition-colors">Features</a>
                <a href="index.html#characters" class="text-sm font-medium text-light-text-secondary dark:text-dark-text-secondary hover:text-anitrain-orange transition-colors">Characters</a>
                <a href="index.html#overview" class="text-sm font-medium text-light-text-secondary dark:text-dark-text-secondary hover:text-anitrain-orange transition-colors">Overview</a>
                <a href="./blog.html" class="text-sm font-medium text-anitrain-orange">News</a>
            </nav>
            <div class="flex items-center space-x-2 sm:space-x-4">
                 <button class="px-5 py-2.5 bg-anitrain-orange text-white font-medium text-sm leading-tight uppercase rounded-full shadow-lg hover:bg-anitrain-orange-dark hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-anitrain-orange transition-all transform hover:scale-105">
                    Get Started
                </button>
                <button id="theme-toggle" type="button" class="p-2 rounded-full text-light-text-secondary dark:text-dark-text-secondary hover:bg-black/5 dark:hover:bg-white/10 focus:outline-none">
                    <ion-icon name="moon-outline" class="text-xl hidden dark:inline"></ion-icon>
                    <ion-icon name="sunny-outline" class="text-xl text-yellow-400 inline dark:hidden"></ion-icon>
                    <span class="sr-only">Toggle theme</span>
                </button>
                <div class="lg:hidden">
                    <button id="nav-open-btn" type="button" class="p-2 rounded-md text-light-text-secondary dark:text-dark-text-secondary hover:bg-black/5 dark:hover:bg-white/10" aria-controls="mobile-menu" aria-expanded="false">
                        <span class="sr-only">Open main menu</span>
                        <ion-icon name="menu-outline" class="text-3xl"></ion-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="lg:hidden hidden" id="mobile-menu">
        <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-light-surface dark:bg-dark-surface">
            <a href="index.html#features" class="block px-3 py-2 rounded-md text-base font-medium">Features</a>
            <a href="index.html#characters" class="block px-3 py-2 rounded-md text-base font-medium">Characters</a>
            <a href="index.html#overview" class="block px-3 py-2 rounded-md text-base font-medium">Overview</a>
            <a href="./blog.html" class="block px-3 py-2 rounded-md text-base font-medium text-anitrain-orange">Blog</a>
        </div>
    </div>
  </header>

  <main class="py-16 px-4 md:px-8 lg:px-12 max-w-7xl mx-auto">
    <div class="text-center mb-16" data-aos="fade-up">
        <h1 class="text-4xl md:text-5xl font-extrabold text-light-text-primary dark:text-dark-text-primary">AniTrain <span class="text-anitrain-orange">News</span></h1>
        <p class="mt-4 text-lg text-light-text-secondary dark:text-dark-text-secondary">Your daily source for the latest in the anime world.</p>
    </div>

    <section id="featured-post" class="mb-16" data-aos="fade-up" data-aos-delay="100"></section>
    
    <section>
        <h2 class="text-3xl font-bold mb-8 text-center md:text-left" data-aos="fade-up">Latest Articles</h2>
        
        <nav class="blog-nav-categories flex flex-wrap gap-3 mb-8 justify-center" data-aos="fade-up" data-aos-delay="100">
          <button onclick="filterCategory('all')" class="category-btn active">All</button>
          <button onclick="filterCategory('reviews')" class="category-btn">Anime Reviews</button>
          <button onclick="filterCategory('upcoming')" class="category-btn">Upcoming Anime</button>
          <button onclick="filterCategory('movies')" class="category-btn">Anime Movies</button>
          <button onclick="filterCategory('training')" class="category-btn">Training Tips</button>
          <button onclick="filterCategory('community')" class="category-btn">Community Spotlight</button>
        </nav>

        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8" id="blog-grid"></div>
    </section>
  </main>

  <footer class="bg-light-surface dark:bg-dark-surface pt-16 pb-8">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="border-t border-light-border dark:border-dark-border pt-8 text-center space-y-2">
        <p class="text-light-text-secondary dark:text-dark-text-secondary text-sm">
          &copy; <span id="currentYear"></span> AniTrain. All rights reserved. Unleash Your Inner Hero.
        </p>
        <p class="text-light-text-secondary dark:text-dark-text-secondary text-sm">
          Built with ❤️ by <a href="https://programmerukesh.com" target="_blank" rel="noopener noreferrer" class="text-anitrain-orange hover:underline">programmerukesh.com</a>
        </p>
      </div>
    </div>
  </footer>

  <div id="modal-backdrop" class="modal-backdrop">
    <div id="modal-content" class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title" class="text-2xl md:text-3xl font-bold"></h2>
        <p id="modal-date" class="text-sm text-light-text-secondary dark:text-dark-text-secondary mt-1"></p>
      </div>
      <div class="modal-body-container">
          <img id="modal-image" class="w-full h-60 object-cover rounded-lg mb-6" src="" alt="Blog post image" />
          <div id="modal-body" class="text-base leading-relaxed prose dark:prose-invert max-w-none"></div>
      </div>
      <button onclick="closeModal()" class="modal-close-btn" aria-label="Close modal">&times;</button>
    </div>
  </div>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <script>
    // --- Initialize AOS ---
    AOS.init({ once: true, duration: 700, easing: 'ease-out-cubic' });

    // --- DOM Elements ---
    const featuredPostContainer = document.getElementById("featured-post");
    const blogGrid = document.getElementById("blog-grid");
    const modalBackdrop = document.getElementById("modal-backdrop");
    
    // --- Sanity.io Configuration ---
    const SANITY_PROJECT_ID = 'oc0d40gm';
    const SANITY_DATASET = 'production';
    const query = encodeURIComponent(`*[_type == "post"] | order(publishedAt desc) {
      _id,
      title,
      slug,
      body,
      mainImage{
        asset->{url}
      },
      publishedAt,
      categories[]->{
        title
      }
    }`);

    // --- Card Creation Functions ---
    function createFeaturedPostCard(post) {
        return `
            <div class="featured-card group cursor-pointer blog-item relative rounded-2xl overflow-hidden shadow-lg h-96 flex items-end p-8 text-white bg-cover bg-center transition-all duration-300" style="background-image: linear-gradient(to top, rgba(0,0,0,0.8), transparent 50%), url('${post.image}')" data-category="${post.categorySlug}">
                <div class="relative z-10">
                    <span class="inline-block bg-anitrain-orange text-white text-xs font-semibold px-3 py-1 rounded-full uppercase mb-2">${post.category}</span>
                    <h3 class="text-3xl md:text-4xl font-bold mb-3 group-hover:text-anitrain-orange transition-colors">${post.title}</h3>
                    <p class="text-gray-200">${post.snippet}</p>
                </div>
            </div>
        `;
    }

    function createPostCard(post, index) {
        return `
            <div class="post-card cursor-pointer blog-item bg-light-surface dark:bg-dark-surface rounded-xl shadow-md overflow-hidden hover:shadow-xl hover:-translate-y-1 transition-all duration-300" data-aos="fade-up" data-aos-delay="${index * 100}" data-category="${post.categorySlug}">
                <img src="${post.image}" alt="${post.title}" class="w-full h-48 object-cover" />
                <div class="p-5">
                    <span class="inline-block bg-anitrain-orange/20 text-anitrain-orange text-xs font-semibold px-2 py-1 rounded-full uppercase mb-2">${post.category}</span>
                    <h3 class="text-xl font-bold text-light-text-primary dark:text-dark-text-primary mb-2">${post.title}</h3>
                    <p class="text-sm text-light-text-secondary dark:text-dark-text-secondary">${post.date}</p>
                </div>
            </div>
        `;
    }

    // --- ✅ FIXED: All data fetching and rendering logic is now in one place ---
    fetch(`https://corsproxy.io/?https://${SANITY_PROJECT_ID}.api.sanity.io/v2023-03-25/data/query/${SANITY_DATASET}?query=${query}`)
      .then(res => res.json())
      .then(({ result }) => {
        // Map the raw data from Sanity to a cleaner format
        const posts = result.map(post => ({
          title: post.title,
          image: post.mainImage?.asset?.url || 'https://placehold.co/800x400/24243e/FF951A?text=AniTrain',
          date: new Date(post.publishedAt).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
          category: post.categories?.[0]?.title || 'General',
          categorySlug: post.categories?.[0]?.title?.toLowerCase().replace(/\s+/g, '-') || 'general',
          snippet: (post.body?.[0]?.children?.[0]?.text || '').slice(0, 150) + "...",
          // ✅ FIXED: Correctly convert Portable Text array to HTML
          content: PortableText.toHtml(post.body || []) 
        }));

        // Render the featured post
        if (posts.length > 0) {
          const featuredPost = posts[0];
          const featuredCard = createFeaturedPostCard(featuredPost);
          featuredPostContainer.innerHTML = featuredCard;
          featuredPostContainer.querySelector('.featured-card').addEventListener('click', () => openModal(featuredPost));
        }

        // Render the rest of the posts in the grid
        if (posts.length > 1) {
          const otherPosts = posts.slice(1);
          otherPosts.forEach((post, i) => {
            const card = createPostCard(post, i);
            blogGrid.insertAdjacentHTML('beforeend', card);
          });
        }
        
        // Attach click listeners to all post cards for the modal
        document.querySelectorAll('.post-card').forEach((card) => {
          const postTitle = card.querySelector('h3').textContent;
          const postData = posts.find(p => p.title === postTitle);
          if (postData) {
            card.addEventListener('click', () => openModal(postData));
          }
        });
      })
      .catch(err => {
        console.error("Sanity fetch error:", err)
        blogGrid.innerHTML = `<p class="text-center text-red-500 col-span-full">Failed to load posts. Please check the console for errors.</p>`;
      });


    /* ============================================
    CATEGORY FILTER FUNCTION
    ============================================ */
    function filterCategory(cat) {
      const allPosts = document.querySelectorAll('.blog-item');
      allPosts.forEach(post => {
        const isVisible = cat === 'all' || post.dataset.category === cat;
        if (isVisible) {
          post.style.display = 'block';
        } else {
          post.style.display = 'none';
        }
      });

      // Toggle active button state
      document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.category-btn[onclick="filterCategory('${cat}')"]`).classList.add('active');
    }

    /* ============================================
    MODAL POPUP FUNCTIONS
    ============================================ */
    function openModal(post) {
      document.getElementById("modal-title").textContent = post.title;
      document.getElementById("modal-date").textContent = post.date;
      document.getElementById("modal-image").src = post.image;
      document.getElementById("modal-body").innerHTML = post.content;
      modalBackdrop.classList.add("active");
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modalBackdrop.classList.remove("active");
      document.body.style.overflow = '';
    }
    
    modalBackdrop.addEventListener('click', (event) => {
        if (event.target === modalBackdrop) { closeModal(); }
    });
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && modalBackdrop.classList.contains('active')) { closeModal(); }
    });

    // --- General Scripts ---
    const themeToggleBtn = document.getElementById('theme-toggle');
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
    }
    themeToggleBtn.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    const navOpenBtn = document.getElementById('nav-open-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    if (navOpenBtn && mobileMenu) {
        navOpenBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
            const isExpanded = navOpenBtn.getAttribute('aria-expanded') === 'true' || false;
            navOpenBtn.setAttribute('aria-expanded', !isExpanded);
            navOpenBtn.querySelector('ion-icon').name = !isExpanded ? 'close-outline' : 'menu-outline';
        });
    }

    const currentYearEl = document.getElementById('currentYear');
    if(currentYearEl) {
        currentYearEl.textContent = new Date().getFullYear();
    }
  </script>
</body>
</html>
