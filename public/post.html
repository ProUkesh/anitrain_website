  <script>
    // ============================
    // ✅ CONFIG (Sanity)
    // ============================
    const SANITY_PROJECT_ID = "7vt4jf3d";
    const SANITY_DATASET = "production";
    const SANITY_API_VERSION = "2023-03-25";

    // ============================
    // Helpers
    // ============================
    const $ = (id) => document.getElementById(id);

    function getSlug() {
      return new URLSearchParams(location.search).get("slug") || "";
    }

    function safeText(text) {
      return (text || "").toString().replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatDate(dateStr) {
      if (!dateStr) return "";
      try { return new Date(dateStr).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' }); }
      catch { return ""; }
    }

    function estimateReadTimeFromBlocks(body) {
      const text = (body || [])
        .map(b => b?._type === "block" ? (b.children || []).map(c => c.text || "").join(" ") : "")
        .join(" ");
      const words = text.split(/\s+/).filter(Boolean).length;
      const minutes = Math.max(1, Math.round(words / 200));
      return `${minutes} min read`;
    }

    function getLocalViews(slug) {
      try {
        const raw = localStorage.getItem("anitrain_post_views") || "{}";
        const obj = JSON.parse(raw);
        return Number(obj[slug] || 0);
      } catch { return 0; }
    }

    function incrementViews(slug) {
      if (!slug) return 0;
      try {
        const raw = localStorage.getItem("anitrain_post_views") || "{}";
        const obj = JSON.parse(raw);
        obj[slug] = Number(obj[slug] || 0) + 1;
        localStorage.setItem("anitrain_post_views", JSON.stringify(obj));
        return obj[slug];
      } catch { return 0; }
    }

    async function shareLink(title, url) {
      try {
        if (navigator.share) await navigator.share({ title, url });
        else { await navigator.clipboard.writeText(url); alert("Link copied!"); }
      } catch {}
    }

    // ============================
    // Portable Text Renderer (simple + fast)
    // ============================
    function renderPortableText(blocks) {
      if (!Array.isArray(blocks)) return "";

      return blocks.map(block => {
        if (!block || block._type !== "block") return "";

        const style = block.style || "normal";
        const children = Array.isArray(block.children) ? block.children : [];
        const markDefs = Array.isArray(block.markDefs) ? block.markDefs : [];

        const markMap = {};
        markDefs.forEach(def => { if (def._key) markMap[def._key] = def; });

        const inline = children.map(span => {
          const text = safeText(span.text || "");
          const marks = Array.isArray(span.marks) ? span.marks : [];
          let out = text;

          marks.forEach(m => {
            if (m === "strong") out = `<strong>${out}</strong>`;
            else if (m === "em") out = `<em>${out}</em>`;
            else if (markMap[m]?.href) out = `<a href="${markMap[m].href}" target="_blank" rel="noopener">${out}</a>`;
          });

          return out;
        }).join("");

        if (style === "h2") return `<h2 class="text-light-text-primary dark:text-dark-text-primary">${inline}</h2>`;
        if (style === "h3") return `<h3 class="text-light-text-primary dark:text-dark-text-primary">${inline}</h3>`;
        if (style === "blockquote") return `<blockquote>${inline}</blockquote>`;
        return `<p>${inline}</p>`;
      }).join("");
    }

    // ============================
    // Sanity Fetchers (fast: only what we need)
    // ============================
    async function fetchPostBySlug(slug) {
      const query = encodeURIComponent(`*[_type=="post" && slug.current==$slug][0]{
        _id,
        title,
        slug,
        body,
        mainImage{asset->{url}},
        publishedAt,
        categories[]->{title},
        author->{name, image{asset->{url}}}
      }`);

      // ✅ Important: variables must be JSON encoded
      const slugParam = encodeURIComponent(JSON.stringify(slug));
      const url =
        `https://${SANITY_PROJECT_ID}.api.sanity.io/v${SANITY_API_VERSION}/data/query/${SANITY_DATASET}` +
        `?query=${query}&$slug=${slugParam}`;

      const res = await fetch(url);
      const data = await res.json();
      return data.result || null;
    }

    async function fetchForSidebar(currentSlug) {
      // One request to get categories + a few posts for recommendations
      const query = encodeURIComponent(`{
        "categories": *[_type=="category"] | order(title asc){title},
        "posts": *[_type=="post" && slug.current != $slug] | order(publishedAt desc)[0...20]{
          title, slug, publishedAt, body, mainImage{asset->{url}}, categories[]->{title}
        }
      }`);

      const slugParam = encodeURIComponent(JSON.stringify(currentSlug));
      const url =
        `https://${SANITY_PROJECT_ID}.api.sanity.io/v${SANITY_API_VERSION}/data/query/${SANITY_DATASET}` +
        `?query=${query}&$slug=${slugParam}`;

      const res = await fetch(url);
      const data = await res.json();
      return data.result || { categories: [], posts: [] };
    }

    // ============================
    // SEO Updaters (best SEO from HTML page)
    // ============================
    function setMeta(name, content) {
      const el = document.querySelector(`meta[name="${name}"]`);
      if (el) el.setAttribute("content", content);
    }

    function setProperty(prop, content) {
      const el = document.querySelector(`meta[property="${prop}"]`);
      if (el) el.setAttribute("content", content);
    }

    function updateCanonical(url) {
      const link = document.querySelector(`link[rel="canonical"]`);
      if (link) link.setAttribute("href", url);
    }

    function updateJsonLd(payload) {
      const el = $("jsonld");
      if (el) el.textContent = JSON.stringify(payload);
    }

    // ============================
    // Recommendations
    // ============================
    function excerptFromBody(body, maxChars = 120) {
      const txt = (body || [])
        .filter(b => b?._type === "block")
        .map(b => (b.children || []).map(c => c.text || "").join(""))
        .join(" ")
        .replace(/\s+/g, " ")
        .trim();
      return txt.length > maxChars ? txt.slice(0, maxChars) + "…" : txt;
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickRelatedThenRandom(posts, currentCategories, count) {
      const catSet = new Set((currentCategories || []).map(c => c?.title).filter(Boolean));
      const related = posts.filter(p => (p.categories || []).some(c => catSet.has(c?.title)));
      const mixed = [...shuffle(related), ...shuffle(posts.filter(p => !related.includes(p)))];
      return mixed.slice(0, count);
    }

    function recCard(post) {
      const slug = post.slug?.current || "";
      const title = safeText(post.title || "Untitled");
      const date = formatDate(post.publishedAt);
      const img = post.mainImage?.asset?.url || "https://placehold.co/600x400/171717/FFF?text=AniTrain";
      const ex = safeText(excerptFromBody(post.body, 110));

      return `
        <a href="./post.html?slug=${encodeURIComponent(slug)}"
           class="group block rounded-2xl overflow-hidden border border-light-border dark:border-dark-border bg-white/60 dark:bg-dark-surface hover:border-anitrain-orange transition-all">
          <div class="flex gap-4 p-4">
            <img src="${img}" alt="${title}" class="w-20 h-16 object-cover rounded-xl border border-light-border dark:border-dark-border"
                 loading="lazy"
                 onerror="this.onerror=null;this.src='https://placehold.co/200x160/171717/FFF?text=AniTrain';">
            <div class="min-w-0">
              <p class="text-xs text-light-text-secondary dark:text-dark-text-secondary mb-1">${date}</p>
              <p class="font-bold text-sm clamp-2 group-hover:text-anitrain-orange">${title}</p>
              <p class="text-xs mt-1 text-light-text-secondary dark:text-dark-text-secondary clamp-2">${ex}</p>
            </div>
          </div>
        </a>
      `;
    }

    function renderCategoriesSidebar(categories) {
      const wrap = $("sidebarCategories");
      wrap.innerHTML = "";

      const all = ["All", ...(categories || []).map(x => x.title).filter(Boolean)];
      all.forEach(cat => {
        const a = document.createElement("a");
        a.href = `./blog.html`;
        a.className = "text-xs font-semibold px-3 py-1 rounded-full bg-anitrain-orange/10 text-anitrain-orange hover:bg-anitrain-orange hover:text-white transition-all";
        a.textContent = cat;
        wrap.appendChild(a);
      });
    }

    // ============================
    // Theme + UI
    // ============================
    function initTheme() {
      const themeToggle = $("theme-toggle");
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        themeToggle?.classList.add('saiyan');
      } else {
        document.documentElement.classList.remove('dark');
      }
      themeToggle?.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        isDark ? themeToggle.classList.add('saiyan') : themeToggle.classList.remove('saiyan');
      });

      // Mobile menu
      const navOpenBtn = $("nav-open-btn");
      const mobileMenu = $("mobile-menu");
      navOpenBtn?.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        const icon = navOpenBtn.querySelector('ion-icon');
        if (icon) icon.name = mobileMenu.classList.contains('hidden') ? 'menu-outline' : 'close-outline';
      });

      // Go to top
      const goTop = $("go-top");
      window.addEventListener('scroll', () => {
        if (!goTop) return;
        const show = window.scrollY >= 400;
        goTop.classList.toggle('opacity-0', !show);
        goTop.classList.toggle('pointer-events-none', !show);
      });

      $("currentYear").textContent = new Date().getFullYear();
    }

    // ============================
    // INIT
    // ============================
    (async function init() {
      initTheme();

      const slug = getSlug();
      const errorBox = $("errorBox");
      if (!slug) {
        errorBox.textContent = "Missing post slug.";
        errorBox.classList.remove("hidden");
        return;
      }

      const [post, sidebarData] = await Promise.all([
        fetchPostBySlug(slug),
        fetchForSidebar(slug)
      ]);

      if (!post) {
        errorBox.textContent = "Post not found. Please check the slug.";
        errorBox.classList.remove("hidden");
        return;
      }

      // views
      const views = incrementViews(slug);

      // Fill post
      const title = post.title || "AniTrain News";
      const date = formatDate(post.publishedAt);
      const authorName = post.author?.name || "AniTrain";
      const authorAvatar = post.author?.image?.asset?.url || "https://placehold.co/80x80/101010/FF951A?text=AU";
      const imageUrl = post.mainImage?.asset?.url || "";

      $("title").textContent = title;
      $("dateLine").textContent = date ? date : "";
      $("authorName").textContent = authorName;
      $("authorAvatar").src = authorAvatar;

      const readTime = estimateReadTimeFromBlocks(post.body);
      $("metaLine").textContent = `${readTime} • ${views} views`;
      $("viewsLine").textContent = `Views: ${views}`;

      if (imageUrl) {
        $("heroImage").src = imageUrl;
        $("heroImage").alt = title;
        $("heroWrap").classList.remove("hidden");
      }

      $("categoryBadges").innerHTML =
        (post.categories || []).map(c => `
          <span class="text-xs font-semibold px-3 py-1 rounded-full bg-anitrain-orange/10 text-anitrain-orange">
            ${safeText(c.title)}
          </span>
        `).join("");

      $("content").innerHTML = renderPortableText(post.body);

      // Share
      const canonical = `https://anitrain.app/post.html?slug=${encodeURIComponent(slug)}`;
      $("shareBtn").addEventListener("click", () => shareLink(title, canonical));

      // Sidebar categories + recommendations
      renderCategoriesSidebar(sidebarData.categories || []);

      const posts = Array.isArray(sidebarData.posts) ? sidebarData.posts : [];
      const picked = pickRelatedThenRandom(posts, post.categories || [], 6);

      $("sidebarRecs").innerHTML = picked.slice(0, 3).map(recCard).join("");
      $("bottomRecs").innerHTML = picked.slice(3, 6).map(recCard).join("");

      // ✅ Dynamic SEO (best possible for HTML + Sanity)
      const excerpt = excerptFromBody(post.body, 155) || "Read the latest AniTrain news, anime fitness tips, and app announcements.";
      document.title = `${title} | AniTrain News`;

      setMeta("description", excerpt);
      setProperty("og:title", `${title} | AniTrain`);
      setProperty("og:description", excerpt);
      setProperty("og:url", canonical);
      setProperty("og:image", imageUrl || "https://anitrain.app/preview.jpg");
      setMeta("twitter:title", `${title} | AniTrain`);
      setMeta("twitter:description", excerpt);
      updateCanonical(canonical);

      updateJsonLd({
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": title,
        "description": excerpt,
        "image": imageUrl ? [imageUrl] : ["https://anitrain.app/preview.jpg"],
        "author": { "@type": "Person", "name": authorName },
        "publisher": {
          "@type": "Organization",
          "name": "AniTrain",
          "logo": { "@type": "ImageObject", "url": "https://anitrain.app/anitrain-logo.png" }
        },
        "datePublished": post.publishedAt || undefined,
        "mainEntityOfPage": canonical
      });
    })();
  </script>
</body>
</html>
